name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Snake
        uses: Platane/snk@v3
        with:
          github_user_name: alejandracorrea01
          outputs: |
            dist/github-snake-red.svg?color_snake=%23FF2D20&color_dots=%230B0B0C,%231A1A1A,%23333333,%23B00000,%23FF2D20
            dist/github-snake-red.gif?color_snake=%23FF2D20&color_dots=%230B0B0C,%231A1A1A,%23333333,%23B00000,%23FF2D20&color_background=%230B0B0C

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
